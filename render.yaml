services:
  # ==============================================================
  # Option 1: Full-Stack Web Service (1-Click Unified Deployment)
  # Free Tier Friendly: Serves both Express API and React Frontend
  # ==============================================================
  - type: web
    name: aashray-old-age-home
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DRIVER
        value: sqlite
